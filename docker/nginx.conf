server {
    listen 80;
    client_max_body_size 100M;

    location ~ ^/(api|sanctum|auth)(/.*)?$ {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ^~ obliga a nginx a tratar esto como el prefijo más largo y NO seguir
    # evaluando locations regex después (incluida `location ~ \.php$` de
    # arriba) — sin esto, un archivo .php que acabara en /storage se
    # ejecutaría como PHP pase lo que pase en la validación de subida del
    # backend. Ver spec/features/027-security-hardening/spec.md (H2).
    location ^~ /storage {
        root /var/www/html/public;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}