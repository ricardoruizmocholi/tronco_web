server {
    listen 80;
    client_max_body_size 100M;

    location ~ ^/(api|sanctum|auth)(/.*)?$ {
        root /var/www/html/public;
        try_files $uri /index.php?$query_string;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
    }

    location ~ \.php$ {
        root /var/www/html/public;
        fastcgi_pass backend:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ^~ obliga a nginx a tratar esto como el prefijo más largo y NO seguir
    # evaluando locations regex después (incluida `location ~ \.php$` de
    # arriba) — sin esto, un archivo .php que acabara en /storage se
    # ejecutaría como PHP pase lo que pase en la validación de subida del
    # backend. Ver spec/features/027-security-hardening/spec.md (H2).
    location ^~ /storage {
        root /var/www/html/public;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeceras de seguridad (Feature 027, B1) — esto es el proxy de
        # DESARROLLO local (Vite dev server detrás). En producción (IONOS,
        # sirviendo el build estático de `npm run build`) hace falta
        # replicar estas cabeceras en lo que sirva ahí, que todavía no está
        # decidido/configurado en este repo — ver tasks.md.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Orígenes externos reales que carga el frontend, verificados por
        # búsqueda en el código antes de escribir esto (no adivinados):
        # - fonts.googleapis.com / fonts.gstatic.com: tipografía (index.css)
        # - nominatim.openstreetmap.org: geocoding de ciudad (fetch, fanfics)
        # - *.basemaps.cartocdn.com: tiles del mapa (Mapa Troncodrilo)
        # - unpkg.com: textura del globo 3D (Bola Troncodrilo)
        # - www.youtube.com / player.vimeo.com: embeds de vídeo de artista
        # img-src se deja amplio a https: a propósito: el admin puede pegar
        # cualquier URL externa como avatar de artista, logo de colaborador,
        # banner o hero slide (campos de texto libre) — una whitelist
        # estrecha ahí rompería contenido ya configurado sin avisar.
        # 'unsafe-inline' en style-src porque Tailwind/Vite inyectan estilos
        # inline. 'unsafe-inline' en script-src es SOLO por el bootstrap
        # inline que el dev server de Vite inyecta para el HMR (confirmado
        # probando en vivo: sin esto, la página entera no carga en local —
        # bloquea el script de arranque de Vite). El build estático de
        # producción (`npm run build`) no inyecta scripts inline, solo
        # <script src="...">, así que la CSP de lo que sirva el build en
        # IONOS debería poder ser más estricta ahí y prescindir de esto.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' ws: wss: https://nominatim.openstreetmap.org; frame-src https://www.youtube.com https://player.vimeo.com; frame-ancestors 'none'" always;
    }
}